name: Build and Release Proxy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: api-proxy-linux
            wb_artifact_name: workbench-agent-linux

          - os: macos-latest
            artifact_name: api-proxy-macos
            wb_artifact_name: workbench-agent-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup V - Linux/macOS
        uses: vlang/setup-v@v1
        with:
          stable: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            make \
            libc6-dev \
            linux-libc-dev \
            pkg-config \
            unzip \
            upx-ucl

      - name: Show V version
        run: v version


      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -e

          TAG_VERSION="${GITHUB_REF#refs/tags/}"

          echo "== Open Source Build =="

          PROXY_PORT="" \
          PROXY_ORIGIN="" \
          PROXY_HEADER="" \
          VERSION="$TAG_VERSION" \
          ARTIFACT_NAME="${{ matrix.artifact_name }}" \
          v -prod -skip-unused -d no_backtrace \
            -cflags "-Os -flto -s" main.v

          test -f main

          upx --best --lzma main
          mv main "${{ matrix.artifact_name }}"

          echo "== Secure Workbench Build =="

          PROXY_PORT="17777" \
          PROXY_ORIGIN="https://api-os.pages.dev" \
          PROXY_HEADER="x-workbench-target" \
          VERSION="$TAG_VERSION" \
          ARTIFACT_NAME="${{ matrix.wb_artifact_name }}" \
          v -prod -skip-unused -d no_backtrace \
            -cflags "-Os -flto -s" main.v

          test -f main

          upx --best --lzma main
          mv main "${{ matrix.wb_artifact_name }}"


      - name: Build macOS
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -e

          TAG_VERSION="${GITHUB_REF#refs/tags/}"

          echo "== Open Source Build =="

          PROXY_PORT="" \
          PROXY_ORIGIN="" \
          PROXY_HEADER="" \
          VERSION="$TAG_VERSION" \
          ARTIFACT_NAME="${{ matrix.artifact_name }}" \
          v -prod -skip-unused -d no_backtrace \
            -cflags "-Os -flto -s" main.v

          test -f main

          mv main "${{ matrix.artifact_name }}"

          echo "== Secure Workbench Build =="

          PROXY_PORT="17777" \
          PROXY_ORIGIN="https://api-os.pages.dev" \
          PROXY_HEADER="x-workbench-target" \
          VERSION="$TAG_VERSION" \
          ARTIFACT_NAME="${{ matrix.wb_artifact_name }}" \
          v -prod -skip-unused -d no_backtrace \
            -cflags "-Os -flto -s" main.v

          test -f main

          mv main "${{ matrix.wb_artifact_name }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-binaries
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.wb_artifact_name }}
            
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show artifacts
        run: |
          find artifacts -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*