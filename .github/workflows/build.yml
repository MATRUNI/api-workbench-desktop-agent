name: Build and Release Proxy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: api-proxy-linux
            wb_artifact_name: workbench-agent-linux

          - os: windows-latest
            artifact_name: api-proxy-windows.exe
            wb_artifact_name: workbench-agent-windows.exe

          - os: macos-latest
            artifact_name: api-proxy-macos
            wb_artifact_name: workbench-agent-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup V - Linux/macOS
        if: matrix.os != 'windows-latest'
        uses: vlang/setup-v@v1
        with:
          stable: true

      - name: Setup V - Windows
        if: matrix.os == 'windows-latest'
        uses: vlang/setup-v@v1.7
        with:
          version: '0.5.2'


      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            make \
            libc6-dev \
            linux-libc-dev \
            pkg-config \
            unzip \
            upx-ucl


      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install UPX - Windows
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: choco install upx -y


      - name: Show V version
        run: v version


      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -e

          TAG_VERSION="${GITHUB_REF#refs/tags/}"

          echo "== Open Source Build =="

          PROXY_PORT="" \
          PROXY_ORIGIN="" \
          PROXY_HEADER="" \
          VERSION="$TAG_VERSION" \
          ARTIFACT_NAME="${{ matrix.artifact_name }}" \
          v -prod -skip-unused -d no_backtrace \
            -cflags "-Os -flto -s" main.v

          test -f main

          upx --best --lzma main
          mv main "${{ matrix.artifact_name }}"

          echo "== Secure Workbench Build =="

          PROXY_PORT="17777" \
          PROXY_ORIGIN="https://api-os.pages.dev" \
          PROXY_HEADER="x-workbench-target" \
          VERSION="$TAG_VERSION" \
          ARTIFACT_NAME="${{ matrix.wb_artifact_name }}" \
          v -prod -skip-unused -d no_backtrace \
            -cflags "-Os -flto -s" main.v

          test -f main

          upx --best --lzma main
          mv main "${{ matrix.wb_artifact_name }}"


      - name: Build macOS
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -e

          TAG_VERSION="${GITHUB_REF#refs/tags/}"

          echo "== Open Source Build =="

          PROXY_PORT="" \
          PROXY_ORIGIN="" \
          PROXY_HEADER="" \
          VERSION="$TAG_VERSION" \
          ARTIFACT_NAME="${{ matrix.artifact_name }}" \
          v -prod -skip-unused -d no_backtrace \
            -cflags "-Os -flto -s" main.v

          test -f main

          mv main "${{ matrix.artifact_name }}"

          echo "== Secure Workbench Build =="

          PROXY_PORT="17777" \
          PROXY_ORIGIN="https://api-os.pages.dev" \
          PROXY_HEADER="x-workbench-target" \
          VERSION="$TAG_VERSION" \
          ARTIFACT_NAME="${{ matrix.wb_artifact_name }}" \
          v -prod -skip-unused -d no_backtrace \
            -cflags "-Os -flto -s" main.v

          test -f main

          mv main "${{ matrix.wb_artifact_name }}"


      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          set "VERSION=%GITHUB_REF_NAME%"

          echo ========================================
          echo Open Source Windows Build
          echo ========================================

          set "PROXY_PORT="
          set "PROXY_ORIGIN="
          set "PROXY_HEADER="
          set "ARTIFACT_NAME=${{ matrix.artifact_name }}"

          if exist main.exe del /f /q main.exe

          v -cc msvc -prod -skip-unused -d no_backtrace main.v

          if errorlevel 1 exit /b 1

          if not exist main.exe (
            echo ERROR: Windows executable was not generated
            exit /b 1
          )

          upx --best --lzma main.exe

          if errorlevel 1 exit /b 1

          move /y main.exe "%ARTIFACT_NAME%"

          echo ========================================
          echo Secure Workbench Windows Build
          echo ========================================

          set "PROXY_PORT=17777"
          set "PROXY_ORIGIN=https://api-os.pages.dev"
          set "PROXY_HEADER=x-workbench-target"
          set "ARTIFACT_NAME=${{ matrix.wb_artifact_name }}"

          if exist main.exe del /f /q main.exe

          v -cc msvc -prod -skip-unused -d no_backtrace main.v

          if errorlevel 1 exit /b 1

          if not exist main.exe (
            echo ERROR: Windows executable was not generated
            exit /b 1
          )

          upx --best --lzma main.exe

          if errorlevel 1 exit /b 1

          move /y main.exe "%ARTIFACT_NAME%"

          echo ========================================
          echo WINDOWS BUILD COMPLETE
          echo ========================================



      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-binaries
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.wb_artifact_name }}
            
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show artifacts
        run: |
          find artifacts -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*