name: Build and Release Proxy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: api-proxy-linux
            wb_artifact_name: workbench-agent-linux

          - os: windows-latest
            artifact_name: api-proxy-windows.exe
            wb_artifact_name: workbench-agent-windows.exe

          - os: macos-latest
            artifact_name: api-proxy-macos
            wb_artifact_name: workbench-agent-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            make \
            libc6-dev \
            linux-libc-dev \
            pkg-config \
            unzip
      - name: Setup V - Linux/macOS
        if: matrix.os != 'windows-latest'
        uses: vlang/setup-v@v1
        with:
          stable: true
      - name: Setup V - Windows
        if: matrix.os == 'windows-latest'
        uses: vlang/setup-v@v1.7
        with:
          version: 'master'
      - name: Enable MSVC Developer Command Prompt
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1


      - name: Show V version
        run: v version
      - name: Install UPX (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y upx-ucl

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -e
          
          # 1. Open Source Build
          PROXY_PORT="" PROXY_ORIGIN="" PROXY_HEADER="" v -prod -skip-unused -d no_backtrace -cflags "-Os -flto -s" main.v
          upx --best --lzma main
          mv main "${{ matrix.artifact_name }}"
          
          # 2. Secure Workbench Build
          PROXY_PORT="17777" PROXY_ORIGIN="https://api-os.pages.dev" PROXY_HEADER="x-workbench-target" v -prod -skip-unused -d no_backtrace -cflags "-Os -flto -s" main.v
          upx --best --lzma main
          mv main "${{ matrix.wb_artifact_name }}"

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -e
          
          # 1. Open Source Build
          PROXY_PORT="" PROXY_ORIGIN="" PROXY_HEADER="" v -prod -skip-unused -d no_backtrace -cflags "-Os -flto -s" main.v
          mv main "${{ matrix.artifact_name }}"
          
          # 2. Secure Workbench Build
          PROXY_PORT="17777" PROXY_ORIGIN="https://api-os.pages.dev" PROXY_HEADER="x-workbench-target" v -prod -skip-unused -d no_backtrace -cflags "-Os -flto -s" main.v
          mv main "${{ matrix.wb_artifact_name }}"

      - name: Install UPX (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install upx -y

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          
          # 1. Open Source Build
          $env:PROXY_PORT=""
          $env:PROXY_ORIGIN=""
          $env:PROXY_HEADER=""
          v -cc msvc -prod -skip-unused -d no_backtrace main.v
          upx --best --lzma main.exe
          Rename-Item main.exe "${{ matrix.artifact_name }}"
          
          # 2. Secure Workbench Build
          $env:PROXY_PORT="17777"
          $env:PROXY_ORIGIN="https://api-os.pages.dev"
          $env:PROXY_HEADER="x-workbench-target"
          v -cc msvc -prod -skip-unused -d no_backtrace main.v
          upx --best --lzma main.exe
          Rename-Item main.exe "${{ matrix.wb_artifact_name }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-binaries
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.wb_artifact_name }}
            
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show artifacts
        run: |
          find artifacts -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*