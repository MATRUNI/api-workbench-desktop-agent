name: Build and Release Proxy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: api-proxy-linux
            wb_artifact_name: workbench-agent-linux

          - os: windows-latest
            artifact_name: api-proxy-windows.exe
            wb_artifact_name: workbench-agent-windows.exe

          - os: macos-latest
            artifact_name: api-proxy-macos
            wb_artifact_name: workbench-agent-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            make \
            libc6-dev \
            linux-libc-dev \
            pkg-config \
            unzip

      - name: Setup V - Linux/macOS
        if: matrix.os != 'windows-latest'
        uses: vlang/setup-v@v1
        with:
          stable: true

      - name: Setup V - Windows
        if: matrix.os == 'windows-latest'
        uses: vlang/setup-v@v1.7
        with:
          version: 'master'

      - name: Enable MSVC Developer Command Prompt
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Show V version
        run: v version

      - name: Install UPX (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y upx-ucl

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          
          # 1. Open Source Build
          PROXY_PORT="" PROXY_ORIGIN="" PROXY_HEADER="" VERSION="$TAG_VERSION" ARTIFACT_NAME="${{ matrix.artifact_name }}" v -prod -skip-unused -d no_backtrace -cflags "-Os -flto -s" main.v
          upx --best --lzma main
          mv main "${{ matrix.artifact_name }}"
          
          # 2. Secure Workbench Build
          PROXY_PORT="17777" PROXY_ORIGIN="https://api-os.pages.dev" PROXY_HEADER="x-workbench-target" VERSION="$TAG_VERSION" ARTIFACT_NAME="${{ matrix.wb_artifact_name }}" v -prod -skip-unused -d no_backtrace -cflags "-Os -flto -s" main.v
          upx --best --lzma main
          mv main "${{ matrix.wb_artifact_name }}"

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          
          # 1. Open Source Build
          PROXY_PORT="" PROXY_ORIGIN="" PROXY_HEADER="" VERSION="$TAG_VERSION" ARTIFACT_NAME="${{ matrix.artifact_name }}" v -prod -skip-unused -d no_backtrace -cflags "-Os -flto -s" main.v
          mv main "${{ matrix.artifact_name }}"
          
          # 2. Secure Workbench Build
          PROXY_PORT="17777" PROXY_ORIGIN="https://api-os.pages.dev" PROXY_HEADER="x-workbench-target" VERSION="$TAG_VERSION" ARTIFACT_NAME="${{ matrix.wb_artifact_name }}" v -prod -skip-unused -d no_backtrace -cflags "-Os -flto -s" main.v
          mv main "${{ matrix.wb_artifact_name }}"

      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install UPX
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: choco install upx -y
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          echo === V ===
          v version

          echo === MSVC ===
          where cl
          cl

          echo === UPX ===
          where upx
          upx --version

          REM ========================================
          REM 1. Open Source Build
          REM ========================================

          echo.
          echo ========================================
          echo Open Source Build
          echo ========================================

          set "PROXY_PORT="
          set "PROXY_ORIGIN="
          set "PROXY_HEADER="
          set "VERSION=%GITHUB_REF_NAME%"
          set "ARTIFACT_NAME=${{ matrix.artifact_name }}"

          echo VERSION=%VERSION%
          echo ARTIFACT_NAME=%ARTIFACT_NAME%

          if exist "%ARTIFACT_NAME%" del /f /q "%ARTIFACT_NAME%"

          echo Running V compiler...
          v -cc msvc -prod -skip-unused -d no_backtrace -o "%ARTIFACT_NAME%" main.v

          echo V EXIT CODE: %ERRORLEVEL%

          echo.
          echo Files after V compilation:
          dir /a

          if not exist "%ARTIFACT_NAME%" (
            echo ERROR: %ARTIFACT_NAME% was not generated
            exit /b 1
          )

          echo Compressing...
          upx --best --lzma "%ARTIFACT_NAME%"

          if errorlevel 1 (
            echo ERROR: UPX failed
            exit /b 1
          )

          REM ========================================
          REM 2. Secure Workbench Build
          REM ========================================

          echo.
          echo ========================================
          echo Secure Workbench Build
          echo ========================================

          set "PROXY_PORT=17777"
          set "PROXY_ORIGIN=https://api-os.pages.dev"
          set "PROXY_HEADER=x-workbench-target"
          set "VERSION=%GITHUB_REF_NAME%"
          set "ARTIFACT_NAME=${{ matrix.wb_artifact_name }}"

          echo VERSION=%VERSION%
          echo ARTIFACT_NAME=%ARTIFACT_NAME%

          if exist "%ARTIFACT_NAME%" del /f /q "%ARTIFACT_NAME%"

          echo Running V compiler...
          v -cc msvc -prod -skip-unused -d no_backtrace -o "%ARTIFACT_NAME%" main.v

          echo V EXIT CODE: %ERRORLEVEL%

          echo.
          echo Files after V compilation:
          dir /a

          if not exist "%ARTIFACT_NAME%" (
            echo ERROR: %ARTIFACT_NAME% was not generated
            exit /b 1
          )

          echo Compressing...
          upx --best --lzma "%ARTIFACT_NAME%"

          if errorlevel 1 (
            echo ERROR: UPX failed
            exit /b 1
          )

          echo.
          echo ========================================
          echo WINDOWS BUILD SUCCESSFUL
          echo ========================================



      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-binaries
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.wb_artifact_name }}
            
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show artifacts
        run: |
          find artifacts -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*